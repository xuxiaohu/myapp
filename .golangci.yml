version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck       # check for unhandled errors
    - gosimple       # simplify code
    - govet          # report suspicious constructs
    - ineffassign    # detect unused assignments
    - staticcheck    # staticcheck suite
    - unused         # check for unused code
    - gofmt          # enforce gofmt formatting
    - goimports      # enforce goimports ordering
    - revive         # fast, configurable linter (replaces golint)
    - gocritic       # opinionated checks
    - misspell       # catch common typos
    - prealloc       # suggest slice pre-allocation
    - unconvert      # remove unnecessary type conversions

linters-settings:
  revive:
    rules:
      - name: exported
        arguments:
          - "checkPrivateReceivers"
          - "sayRepetitiveInsteadOfStutters"
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
  goimports:
    local-prefixes: github.com/xuxiaohu/myapp

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - errcheck
        - gocritic
